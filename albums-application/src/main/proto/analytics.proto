syntax = "proto3";

option java_multiple_files = true;
option java_package = "albums";

service AnalyticsService {
  rpc CalculateAlbumRating (AlbumRatingRequest) returns (AlbumRatingResponse) {}
}

message AlbumRatingRequest {
  string album_id = 1;
}

message AlbumRatingResponse {
  string album_id = 1;
  int32 rating_score = 2;
  string verdict = 3;
}
